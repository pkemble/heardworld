
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Podcast Archive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f3f4f6; }
        .post-card { transition: transform 0.2s; }
        .post-card:hover { transform: translateY(-5px); }
    </style>
</head>
<body class="bg-gray-100 text-gray-900 font-sans leading-normal tracking-normal">
    <nav class="bg-white p-4 shadow-md mb-8">
        <div class="container mx-auto">
            <h1 class="text-2xl font-bold text-indigo-600">Podcast Archive</h1>
        </div>
    </nav>

    <main class="container mx-auto px-4">
        <div id="posts-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Posts will be injected here -->
        </div>
    </main>

    <footer class="mt-12 py-8 bg-white border-t text-center text-gray-500">
        <p>&copy; 2026 Podcast Archive</p>
    </footer>

    <script>
        async function loadPosts() {
            try {
                const response = await fetch('posts.json');
                const posts = await response.json();
                const container = document.getElementById('posts-container');
                
                posts.forEach(post => {
                    const card = document.createElement('div');
                    card.className = 'post-card bg-white rounded-lg shadow px-6 py-8 text-left';
                    
                    const date = post.date ? new Date(post.date).toLocaleDateString() : '';
                    const content = post.content ? post.content.replace(/<[^>]*>?/gm, '').substring(0, 150) + '...' : '';
                    const enclosure = post.enclosure_url ? `<a href="${post.enclosure_url}" class="text-indigo-600 hover:underline mt-4 block" target="_blank">Listen to Episode</a>` : '';

                    card.innerHTML = `
                        <div class="font-bold text-xl mb-2">${post.title}</div>
                        <p class="text-gray-600 text-base">${date}</p>
                        <p class="mt-3 text-gray-700">${content}</p>
                        ${enclosure}
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                console.error('Error loading posts:', error);
            }
        }
        loadPosts();
    </script>
</body>
</html>
